[package]
name = "what-the-tech"
version = "0.1.0"
edition = "2024"

[dependencies]
# Discord
poise = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"] }

# RSS / Atom / JSON Feed parsing
feed-rs = "2.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Config (.env) and serialization
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
